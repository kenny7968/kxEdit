name: ci

on:
  push:
    branches: ['**']    # 全ブランチ。tags は release.yml の担当
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # ローカル絶対パス(Windows ユーザーホーム下 / 開発マシンのリポジトリドライブパス)の
      # 混入を検出する健全性チェック。具体パターンは tools/check-no-local-paths.ps1 を参照。
      # 早期 fail のため setup-dotnet より前に配置(dotnet 依存なし・数秒で完了)。
      - name: ローカルパス検出
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/check-no-local-paths.ps1

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      # NuGet 復元キャッシュ。csproj / Directory.Build.props / .config/dotnet-tools.json のいずれかが変わったら
      # 新規キーで再取得、それ以外の push では restore-keys 経由でヒット。純粋なパフォーマンス改善で機能影響ゼロ。
      - name: NuGet cache
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props', '.config/dotnet-tools.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Local tool restore
        run: dotnet tool restore

      - name: CSharpier check
        run: dotnet csharpier check .

      - name: ビルド(警告=エラー)
        run: dotnet build kxEdit.sln -c Release -warnaserror

      # テストプロジェクトを追加/削除する場合は 3 箇所同期: tools/pre-merge-check.ps1・.github/workflows/ci.yml・.github/workflows/release.yml
      # (sln 一括ステップ寄せは検討済みだが、dotnet test kxEdit.sln が Editor/App 両 UI アセンブリを並列実行するため現状維持)
      - name: Core.Tests
        run: dotnet test tests/kxEdit.Core.Tests -c Release --no-build

      - name: Editor.Tests(LocalOnly 除外)
        run: dotnet test tests/kxEdit.Editor.Tests -c Release --no-build --filter "Category!=LocalOnly"

      - name: App.Tests(LocalOnly 除外)
        run: dotnet test tests/kxEdit.App.Tests -c Release --no-build --filter "Category!=LocalOnly"

      # Issue #48 最終レビュー Q-I-4: ここまでの 3 ステップはすべて Release で、Debug.Assert は
      # [Conditional("DEBUG")] のため Release バイナリに残らない。DocumentState.Path の不変条件を
      # 守る網は Debug.Assert なので、Release だけでは 1 行も走らない(実証: IsPathFullyQualified →
      # IsPathRooted の変異が Release 全緑で生存・Debug では赤)。
      # --no-build を付けないのは別構成のバイナリが要るため。ビルドは App.Tests の依存グラフだけ。
      # Core.Tests の Debug は足さない(既知 S-5 で 4 件赤)。
      # ステップ名は tools/pre-merge-check.ps1 と**完全一致**させる(CLAUDE.md §6: ローカル / CI の
      # 失敗ログを同じキーワードで探せるようにする)。App.Tests に LocalOnly は現状 0 件だが、
      # 上の Release 版と同じ除外を付けて将来追加時の CI 落ちを防ぐ。
      - name: App.Tests(Debug・Debug.Assert 有効)
        run: dotnet test tests/kxEdit.App.Tests -c Debug --filter "Category!=LocalOnly"

      # MD-L-2: 依存 (直接/推移) の可視化。依存更新 PR で人間が diff を確認できる
      # ようログ出力するだけの参考ステップ。lock file check は行わないため
      # continue-on-error で失敗しても CI 全体は成功扱いにする。
      - name: 依存ツリー(参考出力)
        continue-on-error: true
        run: dotnet list package --include-transitive
