name: release

on:
  push:
    tags:
      - 'v*'          # 例: v1.0.0

permissions:
  contents: write     # リリース作成に必要

env:
  TAG: ${{ github.ref_name }}
  ZIP: kxEdit-${{ github.ref_name }}-win-x64.zip

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    # OSS 公開後に GitHub UI 側で "release" environment に Required reviewers 等の
    # protection rules を設定することで承認ゲート化される。private + Free plan では
    # protection rules が使えないため現状は no-op(通常の release と同挙動)。
    # 詳細: docs/plans/2026-07-18-release-env-approval-gate-design.md
    environment: release
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      # CLAUDE.md §9 は「リリース前に表示バージョン更新 commit を積む」と定める。
      # 忘れたままタグを打つと、配布物は -p:Version でタグの値になる一方、
      # リポジトリの Directory.Build.props だけが古いまま残る。ビルド前に落として
      # 30 分のジョブを無駄にしない。
      # (ローカルゲートに対応ステップは置かない。ローカルにはタグが無く比較対象が無いため)
      - name: バージョン整合チェック(タグ と Directory.Build.props)
        shell: pwsh
        run: |
          $props = Get-Content Directory.Build.props -Raw
          if ($props -notmatch '<Version>([^<]+)</Version>') {
            throw "Directory.Build.props に <Version> が見つかりません。"
          }
          $declared = $Matches[1].Trim()
          $expected = $env:TAG.TrimStart('v')
          if ($declared -ne $expected) {
            throw "タグ $env:TAG と Directory.Build.props の <Version> ($declared) が一致しません。タグを打つ前にバージョン更新 commit を積んでください。"
          }
          Write-Output "バージョン整合 OK: $declared"

      # タグ直 push 時にも 0 警告ゲートが必ず走る形にする
      # (implicit build 経由の dotnet test は -warnaserror が伝播しないため素通り経路になっていた)。
      # ci.yml と対称形。以降のテスト 3 ステップは --no-build で二重ビルドを回避する。
      - name: ビルド(警告=エラー)
        run: dotnet build kxEdit.sln -c Release -warnaserror

      # テストプロジェクトを追加/削除する場合は 3 箇所同期: tools/pre-merge-check.ps1・.github/workflows/ci.yml・.github/workflows/release.yml
      # (sln 一括ステップ寄せは検討済みだが、dotnet test kxEdit.sln が Editor/App 両 UI アセンブリを並列実行するため現状維持)
      - name: "テスト(リリース前ゲート: Core)"
        run: dotnet test tests/kxEdit.Core.Tests -c Release --no-build

      - name: "テスト(リリース前ゲート: Editor・LocalOnly 除外)"
        run: dotnet test tests/kxEdit.Editor.Tests -c Release --no-build --filter "Category!=LocalOnly"

      - name: "テスト(リリース前ゲート: App・LocalOnly 除外)"
        run: dotnet test tests/kxEdit.App.Tests -c Release --no-build --filter "Category!=LocalOnly"

      - name: バージョン抽出 (v1.2.3 → 1.2.3)
        id: ver
        shell: pwsh
        run: |
          $v = $env:TAG.TrimStart('v')
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: 配布用ビルド(フレームワーク依存)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: >
          dotnet publish src/kxEdit.App -c Release -r win-x64 --self-contained false
          "-p:Version=$env:VERSION"
          -p:DebugType=embedded
          -o publish

      - name: 説明書を同梱
        shell: pwsh
        run: Copy-Item -Recurse 説明書 publish\説明書

      - name: 変更履歴を同梱
        shell: pwsh
        run: Copy-Item 変更履歴.txt publish\変更履歴.txt

      - name: zip 圧縮
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath $env:ZIP

      - name: リリースノート組み立て(タグ注釈＋動作要件＋SHA256)
        shell: pwsh
        run: |
          # actions/checkout はタグ注釈を落とすことがあるため取り直す
          git fetch --tags --force
          $body = (git tag -l --format='%(contents)' $env:TAG | Out-String).Trim()
          $hash = (Get-FileHash $env:ZIP -Algorithm SHA256 -ErrorAction Stop).Hash.ToLowerInvariant()
          $footer = @(
            ''
            '---'
            '**動作要件**'
            '- Windows 11'
            '- [.NET 9 デスクトップランタイム](https://dotnet.microsoft.com/ja-jp/download/dotnet/9.0) (x64)'
            '- WebView2 ランタイム(マークダウンプレビューで使用。Windows 11 に標準搭載)'
            ''
            '**SHA256**'
            '```'
            "$hash  $env:ZIP"
            '```'
          ) -join "`n"
          "$body`n$footer" | Set-Content notes.md -Encoding utf8

      - name: GitHub リリース作成
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$env:TAG" "$env:ZIP"
          --title "kxEdit $env:TAG"
          --notes-file notes.md
          --verify-tag
